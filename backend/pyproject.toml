[project]
name = "backend"
version = "0.1.0"
description = "StudyMate backend API"
readme = "README.md"
authors = [
    { name = "Fothiss", email = "highspace@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.164.0",
    "langchain-gigachat>=0.5.1",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# Тесты запускаются из `backend/`: корень импорта `app` — текущий каталог.
pythonpath = ["."]
testpaths = ["tests"]
# Классов-тестов в проекте нет, а модели `Test` и `TestRepository` называются
# так же, как pytest ищет тестовые классы.
python_classes = ["*Tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
