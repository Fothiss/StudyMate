<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <title>StudyMate</title>
    <meta
      name="description"
      content="Учебные материалы, тесты и проверка ответов в одном месте"
    />
    <!-- Тема выставляется до первого пейнта, чтобы не было вспышки чужой темы. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("studymate.theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (error) {
          /* хранилище недоступно — остаёмся на светлой теме */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
